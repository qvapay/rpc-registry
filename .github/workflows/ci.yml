name: check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # health check cada 6 h; si una cadena queda sin RPCs sanos, abre issue
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Baseline = registry.json antes del cambio (base de la PR, o el commit anterior en push).
      # Con --strict solo es error un endpoint NUEVO que no responda: lo que ya estaba y falle
      # se avisa y lo vigila el cron, que abre issue si una cadena se queda sin 2 sanos.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:registry.json" > /tmp/registry.base.json
      - if: github.event_name == 'push'
        run: git show HEAD~1:registry.json > /tmp/registry.base.json || cp registry.json /tmp/registry.base.json
      - run: npm run check -- ${{ github.event_name != 'schedule' && '--strict --baseline=/tmp/registry.base.json' || '' }}
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "rpc-down", per_page: 1 });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number,
                body: `Sigue fallando. Run: ${runUrl}` });
              return;
            }
            await github.rest.issues.create({ owner, repo,
              title: `Health check falló ${new Date().toISOString().slice(0,10)}`,
              body: `Una o más cadenas quedaron con menos de 2 RPCs sanos.\n\nVer run: ${runUrl}`,
              labels: ["rpc-down"] });
