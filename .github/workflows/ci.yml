name: check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # health check cada 6 h; si una cadena queda sin RPCs sanos, abre issue
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # En PR/push un endpoint caído es error (no se acepta añadir nodos rotos).
      # En el cron solo falla si una cadena queda con menos de 2 RPCs sanos.
      - run: npm run check -- ${{ github.event_name == 'schedule' && '' || '--strict' }}
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "rpc-down", per_page: 1 });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number,
                body: `Sigue fallando. Run: ${runUrl}` });
              return;
            }
            await github.rest.issues.create({ owner, repo,
              title: `Health check falló ${new Date().toISOString().slice(0,10)}`,
              body: `Una o más cadenas quedaron con menos de 2 RPCs sanos.\n\nVer run: ${runUrl}`,
              labels: ["rpc-down"] });
