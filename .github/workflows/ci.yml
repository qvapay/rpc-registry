name: check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # health check cada 6 h; si un público se cae, abre issue
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Health check falló ${new Date().toISOString().slice(0,10)}`,
              body: `Ver run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["rpc-down"]
            });
